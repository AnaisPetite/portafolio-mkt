<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto / Anaís Cruz</title>

    <!-- Enlace a los estilos CSS -->
    <link rel="stylesheet" href="css/style.css?v=2">

    <!-- Tipografía Outfit desde Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- TARJETA CONTENEDORA PRINCIPAL -->
    <main class="card card-wide">

        <!-- 1. MENÚ DE NAVEGACIÓN -->
        <nav class="navbar">
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="proyectos.html">Proyectos</a></li>
                <li><a href="contacto.html" class="active">Contacto</a></li>
            </ul>
        </nav>
        <!-- CONTENEDOR EN 2 COLUMNAS (FORMULARIO E ILUSTRACIÓN) -->
        <div class="contact-layout">

            <!-- COLUMNA IZQUIERDA: FORMULARIO -->
            <div class="contact-left">

                <!-- Encabezado -->
                <header class="page-header">
                    <h1 class="page-title">Contacto</h1>
                    <div class="divider-left"></div>
                    <p class="page-subtitle">
                        ¿Tienes un proyecto en mente?<br>
                        ¡Hablemos! Completa el formulario y me pondré en contacto contigo.
                    </p>
                </header>

                <!-- Formulario -->
                <form class="contact-form" action="https://formspree.io/f/tu-codigo" method="POST">

                    <div class="form-group">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" id="nombre" name="nombre" class="form-input" placeholder="Tu nombre"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">Correo electrónico</label>
                        <input type="email" id="email" name="email" class="form-input" placeholder="tu@email.com"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="mensaje" class="form-label">Mensaje</label>
                        <textarea id="mensaje" name="mensaje" rows="4" class="form-input form-textarea"
                            placeholder="Cuéntame sobre tu proyecto..." required></textarea>
                    </div>

                    <!-- Botón Enviar con ícono -->
                    <button type="submit" class="btn-submit">
                        <svg class="btn-send-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                        <span>Enviar mensaje</span>
                    </button>

                </form>
            </div>
            <!-- COLUMNA DERECHA: ILUSTRACIÓN Y EMAIL DIRECTO -->
            <div class="contact-right">

                <!-- Ilustración del sobre -->
                <div class="contact-illustration">
                    <img src="img/contacto-ilustracion.png" alt="Ilustración de sobre de contacto"
                        class="illustration-img">
                </div>

                <!-- Tarjeta de correo directo -->
                <div class="direct-email-card">
                    <div class="email-icon-circle">
                        <!-- Ícono de sobre -->
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                        </svg>
                    </div>
                    <div class="email-info-text">
                        <span class="email-label">También puedes escribirme a</span>
                        <a href="mailto:anaisignaciacp@gmail.com" class="email-link">anaisignaciacp@gmail.com</a>
                        <span class="email-note">Responderé a la brevedad posible.</span>
                    </div>
                </div>

            </div>

        </div> <!-- Fin de contact-layout -->

    </main>

</body>

</html>
